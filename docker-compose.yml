name: roadsage-alerts

services:
  api:
    image: ghcr.io/acvigue/roadsage-alerts:main
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # The device registry: which Waze account belongs to which device. Keep it.
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - services

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Alerts are short-lived and rebuilt by scanning, so no persistence is needed.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Not published to the host: only reachable on the service network.
    networks:
      - services

volumes:
  data:

networks:
  services:
    name: roadsage-alerts
    driver: bridge
